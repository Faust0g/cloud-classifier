#Definición inicial de las clases de nubes.

clases:
  - id: cirrus
    codigo: Ci
    nombre_cientifico: Cirrus
    altura: alta
    descripcion: >
      Filamentos blancos y finos, como pinceladas o cabellos, que se ven
      muy arriba en el cielo.
    como_reconocerla:
      - Aspecto fibroso o sedoso
      - Sin sombras propias
    asociaciones: >
      Suelen aparecer antes de un cambio de tiempo, a veces uno o dos días
      antes, pero por sí solas no anuncian lluvia.
    confundible_con: [cirrostratus, cirrocumulus]
    imagen:
      archivo: cirrus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Cirrus (Ci) (Howard 1803)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-cirrus.html"


  - id: cirrocumulus
    codigo: Cc
    nombre_cientifico: Cirrocumulus
    altura: alta
    descripcion: >
      Banco, banda o capa de nubes delgadas y blancas, sin sombras, compuestas
      de elementos muy pequeños en forma de gránulos, ondulaciones.
    como_reconocerla:
     - Pequeños gránulos u ondas blancos, mucho más pequeños que los del Altocumulus
     - Aspecto fino y sin sombras propias, a menudo con un patrón regular
    asociaciones: >
      Suele aparecer en cielos de gran altura con Cirrus y Cirrostratus,
      y puede señalar cambios en la circulación del aire en niveles altos.
      Cuando forma una capa extensa de pequeños gránulos u ondulaciones,
      puede ser una señal de transición en el estado del cielo, aunque no
      suele estar asociada directamente con precipitaciones en superficie.
    confundible_con: [altocumulus, cirrostratus]
    imagen:
      archivo: cirrocumulus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Cirrocumulus (Cc) (Howard 1803; Renou 1855)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-cirrocumulus.html"


  - id: cirrostratus
    codigo: Cs
    nombre_cientifico: Cirrostratus
    altura: alta
    descripcion: >
      Velo nuboso transparente y blanquecino, de aspecto fibroso o liso, que cubre total
      o parcialmente el cielo y que generalmente produce fenómenos de halo.
    como_reconocerla:
      - Velo blanquecino y uniforme a través del cual se distingue el Sol o la Luna
      - Halo alrededor del Sol o de la Luna, frecuente cuando el velo es delgado
    asociaciones: >
      Suele aparecer antes de la llegada de un frente cálido o de un sistema
      de mal tiempo. Si el velo se extiende y se vuelve progresivamente más
      denso, puede anunciar un aumento de la nubosidad y la llegada de lluvia
      durante las horas siguientes o el día siguiente.
    confundible_con: [cirrus, altostratus]
    imagen:
      archivo: cirrostratus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Cirrostratus (Cs) ((Howard 1803); Renou 1855)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-cirrostratus.html"


  - id: altocumulus
    codigo: Ac
    nombre_cientifico: Altocumulus
    altura: media
    descripcion: >
      Banco, banda delgada o capa de nubes de color blanco o gris, o a la vez blanco y gris, que
      normalmente tienen sombras, compuestos de parches (una o varias capas) con aspecto de masas redondeadas o rodillos
    como_reconocerla:
      - Masas redondeadas, losetas o rodillos de tamaño intermedio, normalmente con sombras
      - Elementos más grandes que los del Cirrocumulus y más pequeños que los del Stratocumulus
    asociaciones: >
      Suele aparecer en situaciones de humedad e inestabilidad en niveles
      medios. Cuando se presenta con aspecto de pequeñas torres
      (Altocumulus castellanus), indica inestabilidad atmosférica y puede
      anticipar el desarrollo de Cumulus de gran crecimiento y tormentas,
      especialmente si aparece durante la mañana.
    confundible_con: [cirrocumulus, stratocumulus]
    imagen:
      archivo: altocumulus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Altocumulus (Ac) (Renou 1855)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-altocumulus.html"


  - id: altostratus
    codigo: As
    nombre_cientifico: Altostratus
    altura: media
    descripcion: >
      Capa gris o azulada, bastante uniforme, que cubre gran parte del cielo.
      El Sol se ve de forma difusa, como a través de un vidrio esmerilado.
    como_reconocerla:
      - Sol visible solo vagamente, sin contorno nítido
      - Cielo cubierto de manera pareja, sin elementos separados
      - No produce halo
    asociaciones: >
      Suele aparecer por delante de sistemas frontales y, si se espesa, puede
      terminar en lluvia o nieve continua. No siempre llega a precipitar.
    confundible_con: [cirrostratus, nimbostratus]
    imagen:
      archivo: altostratus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Altostratus (As) (Renou 1855)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-altostratus.html"


  - id: nimbostratus
    codigo: Ns
    nombre_cientifico: Nimbostratus
    altura: media
    descripcion: >
      Capa gris oscura y muy espesa que tapa por completo el Sol y de la que
      cae lluvia o nieve de forma más o menos continua.
    como_reconocerla:
      - Sol totalmente oculto
      - Precipitación persistente, no en chubascos cortos
      - A veces con jirones de nubes más bajas por debajo
    asociaciones: >
      Se asocia a lluvia o nieve continua y de larga duración, a diferencia
      de los chubascos breves de las nubes de tormenta.
    confundible_con: [altostratus, stratus]
    imagen:
      archivo: nimbostratus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Nimbostratus (Ns) (CEN 1930)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-nimbostratus.html"


  - id: stratocumulus
    codigo: Sc
    nombre_cientifico: Stratocumulus
    altura: baja
    descripcion: >
      Capa o banco de nubes grises y blancas formado por masas redondeadas,
      como rodillos o losetas grandes, con partes más oscuras.
    como_reconocerla:
      - Elementos redondeados más grandes que los del altocumulus
      - Zonas oscuras, con claros de cielo entre los elementos o capa casi continua
    asociaciones: >
      Es una nube muy común que por lo general no trae precipitación
      importante, a lo sumo llovizna débil. Suele asociarse a tiempo gris y estable.
    confundible_con: [altocumulus, stratus]
    imagen:
      archivo: stratocumulus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Stratocumulus (Sc) (Kaemtz 1840)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-stratocumulus.html"


  - id: stratus
    codigo: St
    nombre_cientifico: Stratus
    altura: baja
    descripcion: >
      Capa gris y baja, de base bastante uniforme, parecida a una niebla
      elevada que cubre el cielo de manera pareja.
    como_reconocerla:
      - Base uniforme y sin formas definidas
      - Si se ve el Sol, su contorno es nítido
      - Puede estar tan baja que se confunde con niebla
    asociaciones: >
      Se asocia a cielos grises y tiempo húmedo y estable. A veces deja
      llovizna fina o niebla, pero en general no trae lluvia fuerte.
    confundible_con: [nimbostratus, stratocumulus]
    imagen:
      archivo: stratus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Stratus (St) (Howard 1803; Hildebrandsson 1887; Abercromby 1887)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-stratus.html"


  - id: cumulus
    codigo: Cu
    nombre_cientifico: Cumulus
    altura: baja
    descripcion: >
      Nubes separadas, blancas y con forma de coliflor o de algodón, de base
      oscura y casi plana.
    como_reconocerla:
      - Bordes bien definidos
      - Parte superior abultada y brillante
      - Base más oscura y plana, con cielo azul entre una nube y otra
    asociaciones: >
      Las pequeñas y aisladas se asocian a buen tiempo. Si crecen mucho en
      altura a lo largo del día, pueden ser el inicio de nubes de tormenta.
    confundible_con: [stratocumulus, cumulonimbus]
    imagen:
      archivo: cumulus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Cumulus (Cu) (Howard 1803)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-cumulus.html"


  - id: cumulonimbus
    codigo: Cb
    nombre_cientifico: Cumulonimbus
    altura: baja
    descripcion: >
      Nube enorme y densa, con forma de montaña o de torre, cuya parte
      superior suele aplanarse en forma de yunque. Su base es muy oscura.
    como_reconocerla:
      - Gran desarrollo vertical
      - Cima aplanada o en forma de yunque
      - Base muy oscura, a veces con cortinas de lluvia por debajo
    asociaciones: >
      Se asocia a tormentas: chubascos intensos, truenos y relámpagos y, a
      veces, granizo o ráfagas fuertes.
    confundible_con: [cumulus, nimbostratus]
    imagen:
      archivo: cumulonimbus.jpg
      credito: "CCSN (CC0)"
    fuentes:
      - titulo: "Atlas Internacional de Nubes: Cumulonimbus (Cb) (Weilbach 1880)"
        url: "https://cloudatlas.wmo.int/es/clouds-genera-cumulonimbus.html"


no_nube:
  mensaje: "No veo una nube que pueda clasificar. Probá con otra foto."

cautela_general: >
  Las asociaciones describen información general sobre cada tipo de nube; no son un pronóstico local ni un aviso sobre las condiciones del cielo de esta foto.