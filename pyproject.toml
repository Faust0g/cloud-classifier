[project]
name = "cloud-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fausto", email = "faustojgonzalo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.30.0",
    "pillow>=12.3.0",
]

[project.scripts]
cloud-classifier = "cloud_classifier:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
]
